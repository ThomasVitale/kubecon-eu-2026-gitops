profile: run

packages:
  include:
    - cert-manager-webhook-hetzner
    - crossplane
    - dependency-track
    - gitops-configurer
    - kyverno
    - metrics-server
    - opentelemetry-operator
    - postgresql-operator

ingress:
  domain: <your-domain> # e.g. example.com
  issuer: letsencrypt-prod-issuer

workspaces:
  - name: apps
  - name: observability
    pod_security: baseline # the OpenTelemetry Collector doesn't satisfy the restricted Pod Security Standard

observability:
  metrics:
    exporter: otlp
    endpoint: http://otel-collector.observability.svc.cluster.local:4317
  tracing:
    enabled: true
    endpoint: http://otel-collector.observability.svc.cluster.local:4317
    sampling_rate: 1.0

# Let's Encrypt issues the wildcard certificates via DNS-01 challenges solved with the Hetzner API
cert_manager:
  issuers:
    letsencrypt:
      enabled: true
      environment: production
      email: changeme@example.com # Email address for ACME registration and recovery contact
      solver: dns01
      dns01:
        provider: hetzner
        credentials:
          secret: hetzner-dns
          key: api-token
          namespace: kadras-system

envoy_gateway:
  envoy:
    service:
      annotations:
        load-balancer.hetzner.cloud/location: nbg1 # change to your cluster location, if needed
        load-balancer.hetzner.cloud/name: kadras-devex-lb
        load-balancer.hetzner.cloud/use-private-ip: "true"

dependency_track:
  api_server:
    storage:
      size: 5Gi
  postgresql:
    storage:
      size: 10Gi

flux:
  policies:
    enabled: true

gitops_configurer:
  git:
    url: https://github.com/ThomasVitale/kubecon-eu-2026-gitops # you can change this to your own Git repository to store the GitOps configuration for your cluster
    path: clusters/devex

knative_serving:
  observability:
    request_metrics:
      enabled: true
      exporter: otlp
      endpoint: http://otel-collector.observability.svc.cluster.local:4317
