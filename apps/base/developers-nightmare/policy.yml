apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: verify-developers-nightmare-image
  annotations:
    policies.kyverno.io/title: Verify Developer's Nightmare Image
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
    policies.kyverno.io/description: >-
      Verify that the developers-nightmare image was signed with Cosign keyless and has
      a GitHub artifact attestation with SLSA v1 build provenance, both produced by the
      Commit Stage workflow on the main branch of ThomasVitale/developers-nightmare.
spec:
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: ghcr.io/thomasvitale/developers-nightmare:*
    - glob: ghcr.io/thomasvitale/developers-nightmare@*
  validationConfigurations:
    mutateDigest: true
    verifyDigest: false
    required: true
  attestors:
    # Both the image signature (cosign sign) and the GitHub attestation (actions/attest)
    # are created by the "package" job of the Commit Stage workflow running on main.
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/ThomasVitale/developers-nightmare/.github/workflows/commit-stage.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: slsaProvenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    - name: allImages
      expression: images.?containers.orValue([]) + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([])
  validations:
    - message: Images must be signed by the Commit Stage workflow of ThomasVitale/developers-nightmare on main.
      expression: >-
        variables.allImages.map(image, verifyImageSignatures(image, [attestors.github])).all(count, count > 0)
    - message: Images must have a SLSA provenance attestation signed by the Commit Stage workflow of ThomasVitale/developers-nightmare on main.
      expression: >-
        variables.allImages.map(image, verifyAttestationSignatures(image, attestations.slsaProvenance, [attestors.github])).all(count, count > 0)
    - message: The SLSA provenance must describe a GitHub Actions build of the Commit Stage workflow on main in ThomasVitale/developers-nightmare.
      expression: >-
        variables.allImages.map(image, extractPayload(image, attestations.slsaProvenance).predicate).all(p,
          p.buildDefinition.buildType == 'https://actions.github.io/buildtypes/workflow/v1' &&
          p.buildDefinition.externalParameters.workflow.repository == 'https://github.com/ThomasVitale/developers-nightmare' &&
          p.buildDefinition.externalParameters.workflow.path == '.github/workflows/commit-stage.yml' &&
          p.buildDefinition.externalParameters.workflow.ref == 'refs/heads/main')
