name: Production Stage

on:
  repository_dispatch:
    types: [app-delivery]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update application version
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_TARGET: ${{ github.event.client_payload.app_target }}
      APP_IMAGE: ${{ github.event.client_payload.app_image }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      APP_VERSION: ${{ github.event.client_payload.app_version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Validate request
        run: |
          name_pattern='^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          tag_pattern='^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'

          if [[ ! "$APP_TARGET" =~ $name_pattern || "$APP_TARGET" == "base" ]]; then
            echo "::error::Invalid app_target in the payload."
            exit 1
          fi
          if [[ ! "$APP_NAME" =~ $name_pattern ]]; then
            echo "::error::Invalid app_name in the payload."
            exit 1
          fi
          if [[ ! "$APP_VERSION" =~ $tag_pattern ]]; then
            echo "::error::Invalid app_version in the payload: it must be a valid OCI image tag."
            exit 1
          fi

          kustomization="apps/${APP_TARGET}/${APP_NAME}/kustomization.yml"
          if [[ ! -f "$kustomization" ]]; then
            echo "::error::No kustomization found for the requested application and target."
            exit 1
          fi
          # Only update images already managed by the kustomization.
          if ! IMAGE="$APP_IMAGE" yq -e '.images[] | select(.name == strenv(IMAGE))' "$kustomization" > /dev/null; then
            echo "::error::The app_image in the payload isn't managed by the kustomization."
            exit 1
          fi

      - name: Update image version
        working-directory: apps/${{ env.APP_TARGET }}/${{ env.APP_NAME }}
        run: kustomize edit set image "${APP_IMAGE}:${APP_VERSION}"

      - name: Commit and push updated manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add "apps/${APP_TARGET}/${APP_NAME}/kustomization.yml"
          if git diff --cached --quiet; then
            echo "The application is already at the requested version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ${APP_NAME} to version ${APP_VERSION}"

          gh auth setup-git
          git push origin HEAD:main
