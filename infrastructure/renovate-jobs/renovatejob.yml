# Renovate credentials: a fine-grained GitHub PAT with access to the repositories below.
# See https://github.com/mogenius/renovate-operator/blob/main/docs/platforms/github-pat.md
#   kubectl create secret generic renovate-secret \
#     --from-literal=GITHUB_COM_USER=ThomasVitale \
#     --from-literal=GITHUB_COM_TOKEN=github_pat_yourTokenHere \
#     --from-literal=RENOVATE_TOKEN=github_pat_yourTokenHere \
#     --namespace renovate-operator
# Do NOT commit real tokens to git.
---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
  namespace: renovate-operator
spec:
  schedule: "0 * * * *"
  secretRef: renovate-secret
  provider:
    name: github
  image: ghcr.io/renovatebot/renovate:44.253.3
  parallelism: 2
  discoveryFilters:
    - ThomasVitale/developers-nightmare
    - ThomasVitale/kubecon-eu-2026-gitops
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "platformCommit": "enabled",
        "gitAuthor": "Thomas Vitale <8523418+ThomasVitale@users.noreply.github.com>"
      }
